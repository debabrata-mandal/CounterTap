name: Release

on:
  push:
    branches:
      - main

jobs:
  # ── Job 1: Run tests ──────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Inject google-services.json (business app)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BUSINESS }}" | base64 --decode > counter-tap-business/app/google-services.json

      - name: Inject google-services.json (customer app)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_CUSTOMER }}" | base64 --decode > counter-tap/app/google-services.json

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run all tests
        run: |
          ./gradlew :counter-tap-business:app:testDebugUnitTest
          ./gradlew :counter-tap:app:testDebugUnitTest

  # ── Job 2: Build + publish to GitHub Releases ────────────────────────────
  build-and-release:
    name: Build & Publish GitHub Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Inject google-services.json (business app)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BUSINESS }}" | base64 --decode > counter-tap-business/app/google-services.json

      - name: Inject google-services.json (customer app)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_CUSTOMER }}" | base64 --decode > counter-tap/app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > keystore.jks

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Derive version from build.gradle.kts
        id: version
        run: |
          NAME=$(grep 'versionName' counter-tap/app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Build release APK + AAB — business app
        run: |
          ./gradlew :counter-tap-business:app:assembleRelease
          ./gradlew :counter-tap-business:app:bundleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APK + AAB — customer app
        run: |
          ./gradlew :counter-tap:app:assembleRelease
          ./gradlew :counter-tap:app:bundleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename artifacts with version
        run: |
          mv counter-tap-business/app/build/outputs/apk/release/app-release.apk \
             counter-tap-business/app/build/outputs/apk/release/countertap-business-v${{ steps.version.outputs.name }}.apk
          mv counter-tap-business/app/build/outputs/bundle/release/app-release.aab \
             counter-tap-business/app/build/outputs/bundle/release/countertap-business-v${{ steps.version.outputs.name }}.aab
          mv counter-tap/app/build/outputs/apk/release/app-release.apk \
             counter-tap/app/build/outputs/apk/release/countertap-v${{ steps.version.outputs.name }}.apk
          mv counter-tap/app/build/outputs/bundle/release/app-release.aab \
             counter-tap/app/build/outputs/bundle/release/countertap-v${{ steps.version.outputs.name }}.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-${{ github.run_number }}
          name: CounterTap v${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          files: |
            counter-tap-business/app/build/outputs/apk/release/countertap-business-v${{ steps.version.outputs.name }}.apk
            counter-tap-business/app/build/outputs/bundle/release/countertap-business-v${{ steps.version.outputs.name }}.aab
            counter-tap/app/build/outputs/apk/release/countertap-v${{ steps.version.outputs.name }}.apk
            counter-tap/app/build/outputs/bundle/release/countertap-v${{ steps.version.outputs.name }}.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 3: Play Store upload (added when Play Store account is ready) ─────
