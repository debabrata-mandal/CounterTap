name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ── Job 1: Tests ──────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Inject google-services.json (business app)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BUSINESS }}" | base64 --decode > counter-tap-business/app/google-services.json

      - name: Inject google-services.json (customer app)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_CUSTOMER }}" | base64 --decode > counter-tap/app/google-services.json

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests — business app
        run: ./gradlew :counter-tap-business:app:testDebugUnitTest

      - name: Run unit tests — customer app
        run: ./gradlew :counter-tap:app:testDebugUnitTest

  # ── Job 2: Build business app (runs in parallel with job 3) ───────────────
  build-business:
    name: Build Business App
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Inject google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BUSINESS }}" | base64 --decode > counter-tap-business/app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > keystore.jks

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Derive version name
        id: version
        run: |
          NAME=$(grep 'versionName' counter-tap-business/app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Build release APK
        run: ./gradlew :counter-tap-business:app:assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release AAB
        run: ./gradlew :counter-tap-business:app:bundleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename artifacts
        run: |
          mv counter-tap-business/app/build/outputs/apk/release/app-release.apk \
             counter-tap-business/app/build/outputs/apk/release/countertap-business-v${{ steps.version.outputs.name }}.apk
          mv counter-tap-business/app/build/outputs/bundle/release/app-release.aab \
             counter-tap-business/app/build/outputs/bundle/release/countertap-business-v${{ steps.version.outputs.name }}.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: business-apk
          path: counter-tap-business/app/build/outputs/apk/release/countertap-business-v${{ steps.version.outputs.name }}.apk
          retention-days: 1

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: business-aab
          path: counter-tap-business/app/build/outputs/bundle/release/countertap-business-v${{ steps.version.outputs.name }}.aab
          retention-days: 1

  # ── Job 3: Build customer app (runs in parallel with job 2) ───────────────
  build-customer:
    name: Build Customer App
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Inject google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_CUSTOMER }}" | base64 --decode > counter-tap/app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > keystore.jks

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Derive version name
        id: version
        run: |
          NAME=$(grep 'versionName' counter-tap/app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Build release APK
        run: ./gradlew :counter-tap:app:assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release AAB
        run: ./gradlew :counter-tap:app:bundleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename artifacts
        run: |
          mv counter-tap/app/build/outputs/apk/release/app-release.apk \
             counter-tap/app/build/outputs/apk/release/countertap-v${{ steps.version.outputs.name }}.apk
          mv counter-tap/app/build/outputs/bundle/release/app-release.aab \
             counter-tap/app/build/outputs/bundle/release/countertap-v${{ steps.version.outputs.name }}.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: counter-tap/app/build/outputs/apk/release/countertap-v${{ steps.version.outputs.name }}.apk
          retention-days: 1

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-aab
          path: counter-tap/app/build/outputs/bundle/release/countertap-v${{ steps.version.outputs.name }}.aab
          retention-days: 1

  # ── Job 4: Publish to GitHub Releases ─────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [build-business, build-customer]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive version name
        id: version
        run: |
          NAME=$(grep 'versionName' counter-tap/app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-${{ github.run_number }}
          name: CounterTap v${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 5: Play Store upload (uncomment when account is ready) ────────────
