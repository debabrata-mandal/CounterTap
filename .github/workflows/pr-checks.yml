name: PR Checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '**/*.gradle.kts'
      - '**/build.gradle'
      - '**/AndroidManifest.xml'
      - '**/res/**'

jobs:
  lint-and-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Inject google-services.json (business app)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BUSINESS }}" | base64 --decode > counter-tap-business/app/google-services.json

      - name: Inject google-services.json (customer app)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_CUSTOMER }}" | base64 --decode > counter-tap/app/google-services.json

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Lint — business app
        run: ./gradlew :counter-tap-business:app:lintDebug

      - name: Lint — customer app
        run: ./gradlew :counter-tap:app:lintDebug

      - name: Unit tests — business app
        run: ./gradlew :counter-tap-business:app:testDebugUnitTest

      - name: Unit tests — customer app
        run: ./gradlew :counter-tap:app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          retention-days: 3
          path: |
            counter-tap-business/app/build/reports/
            counter-tap/app/build/reports/
